[project]
name = "jupyter-cleaner"
version = "0.1.0"
description = "Convert Jupyter notebooks to clean, compact Markdown."
readme = "README.md"
authors = [
    { name = "Danielle Nova", email = "99331448+oNovalSliveDNo@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "pandas>=3.0.5",
    "typer",
]

[project.scripts]
jupyter-cleaner = "jupyter_cleaner.cli:app"

[build-system]
requires = ["uv_build>=0.7.22,<0.8.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
extend-exclude = [
    "examples/*.ipynb",
    "tests/fixtures/*.ipynb",
    # Golden files must preserve notebook source byte-for-byte, including quote style.
    "tests/fixtures/*.expected.md",
    "examples/*.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
